<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nordicgrund">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Nordicgrund · catalogo discografico</title>
<style>
:root {
  --bg:#0a0a0a; --bg2:#111; --bg3:#181818; --bg4:#1e1e1e;
  --border:#2a2a2a; --border2:#333;
  --text:#e8e8e8; --text2:#aaa; --text3:#666;
  --accent:#4a9eff; --accent2:#2d7adb;
  --gold:#c9a84c; --gold2:#a8893e;
  --red:#c0392b;
  --live:#5fd3a3;
  --radius:4px;
  --sidebar:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
     font-size:13px;display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
#sidebar-header h1{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
#sidebar-header p{font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
#nav{flex:1;overflow-y:auto;padding:8px 0}
#nav::-webkit-scrollbar{width:4px}
#nav::-webkit-scrollbar-thumb{background:var(--border2)}
.nav-section{padding:10px 16px 4px;font-size:10px;color:var(--text3);
  letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.nav-btn{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--text2);padding:6px 16px;cursor:pointer;font-size:12px;
  border-left:2px solid transparent;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{color:var(--accent);border-left-color:var(--accent);background:var(--bg3)}
.nav-count{float:right;font-size:10px;color:var(--text3);margin-top:1px}

#db-stats{padding:12px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);line-height:1.7}
#db-stats strong{color:var(--text2)}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--bg2);border-bottom:1px solid var(--border)}
#search{flex:1;background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:7px 12px;border-radius:var(--radius);font-size:13px;outline:none}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--text3)}
#filter-bar{display:flex;gap:6px;padding:8px 16px;background:var(--bg2);
  border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);
  padding:4px 10px;border-radius:var(--radius);cursor:pointer;font-size:11px;transition:all .15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
#sort-select{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);
  padding:4px 8px;border-radius:var(--radius);font-size:11px;cursor:pointer;outline:none;margin-left:auto}
#results-info{font-size:11px;color:var(--text3);padding:0 16px;white-space:nowrap}

/* ── GRID ── */
#content{flex:1;overflow-y:auto;padding:16px}
#content::-webkit-scrollbar{width:6px}
#content::-webkit-scrollbar-track{background:var(--bg)}
#content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.album-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  cursor:pointer;transition:all .2s;overflow:hidden;position:relative}
.card-actions{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;
  padding:18px 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;
  transition:opacity .15s;pointer-events:none}
.album-card:hover .card-actions,.album-card:focus-within .card-actions{opacity:1;pointer-events:auto}
@media (hover:none){.card-actions{opacity:1;pointer-events:auto;padding-top:6px;background:none;justify-content:flex-end}}
.card-actions button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(20,20,20,.85);color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}
.card-actions button:hover{background:var(--accent);border-color:var(--accent)}
.card-actions button.on{background:var(--accent);border-color:var(--accent)}
.album-card:hover{border-color:var(--border2);transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
.album-cover{width:100%;aspect-ratio:1;position:relative;overflow:hidden;background:var(--bg3)}
.album-cover img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;
  inset:0;opacity:0;transition:opacity .4s}
.album-cover img.loaded{opacity:1}
.album-cover-bg{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center}
.album-cover-num{font-size:9px;color:rgba(255,255,255,.25);letter-spacing:.05em;
  font-weight:600;text-transform:uppercase}
.album-info{padding:8px 10px}
.album-artist{font-size:10px;color:var(--text3);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-title{font-size:11px;color:var(--text);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-meta{display:flex;align-items:center;gap:4px;margin-top:4px}
.album-year{font-size:10px;color:var(--text3)}
.album-cat{font-size:9px;color:var(--text3);margin-left:auto;opacity:.6}
.ind{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ind-owned{background:var(--accent)}
.ind-wish{background:var(--gold)}

/* ── CONCERTI ── */
.album-card.live-lead{border-color:rgba(95,211,163,.45)}
.album-card.live-lead:hover{border-color:var(--live)}
.live-badge{position:absolute;top:6px;left:6px;z-index:2;background:rgba(10,10,10,.8);
  color:var(--live);border:1px solid rgba(95,211,163,.55);border-radius:10px;font-size:9px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;pointer-events:none}
.live-dot{position:absolute;top:7px;left:7px;z-index:2;width:8px;height:8px;border-radius:50%;
  background:var(--live);opacity:.7;box-shadow:0 0 0 2px rgba(10,10,10,.75);pointer-events:none}
.musician-tag.live{border-color:rgba(95,211,163,.6);color:var(--live)}
.musician-tag.live::before{content:'♪ '}
.musician-tag.live:hover{border-color:var(--live);background:rgba(95,211,163,.08)}
.concert-list{display:flex;flex-direction:column;gap:6px}
.concert-row{display:flex;gap:12px;align-items:flex-start;background:var(--bg3);
  border:1px solid var(--border);border-radius:4px;padding:8px 10px;font-size:11px;line-height:1.45}
.concert-date{color:var(--live);font-weight:600;white-space:nowrap;min-width:92px}
.concert-body{flex:1;min-width:0}
.concert-what{color:var(--text)}
.concert-with{color:var(--text2)}
.concert-info{color:var(--text3);font-style:italic}
.concert-where{color:var(--text3)}
.concert-tag{font-size:9px;border:1px solid var(--border2);border-radius:8px;padding:0 6px;
  color:var(--text2);margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
.concert-more{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;
  padding:4px 0;text-align:left}
.concert-more:hover{color:var(--live)}
.source-note{font-size:10px;color:var(--text3);margin-top:8px}
.source-note a{color:var(--text3)}
#artist-concerts{display:none;padding:10px 16px 12px;background:var(--bg2);border-bottom:1px solid var(--border)}
#artist-concerts.open{display:block}
#artist-concerts .section-title{padding:0 0 8px}
@media (max-width:600px){
  .concert-row{flex-direction:column;gap:2px}
  .concert-date{min-width:0}
}

/* ── DETAIL PANEL ── */
#detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px}
#detail-overlay.open{display:flex}
#detail-panel{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
  width:100%;max-width:680px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column}
#detail-panel::-webkit-scrollbar{width:5px}
#detail-panel::-webkit-scrollbar-thumb{background:var(--border2)}
#detail-top{display:flex;gap:20px;padding:20px}
#detail-cover{width:160px;min-width:160px;aspect-ratio:1;border-radius:4px;overflow:hidden;
  position:relative;background:var(--bg3)}
#detail-cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;
  opacity:0;transition:opacity .3s}
#detail-cover img.loaded{opacity:1}
#detail-cover-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#detail-cover-num{font-size:11px;color:rgba(255,255,255,.2);letter-spacing:.06em;font-weight:600}
#detail-meta{flex:1}
#detail-cat{font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
#detail-title{font-size:20px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:8px}
#detail-artist{font-size:14px;color:var(--text2);margin-bottom:6px}
#detail-year{font-size:12px;color:var(--text3);margin-bottom:12px}
#detail-musicians{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}
#detail-notes{font-size:11px;color:var(--text3);font-style:italic;margin-bottom:12px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:var(--radius);border:1px solid;cursor:pointer;
  font-size:12px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-owned-active{background:var(--bg3);border-color:var(--accent);color:var(--accent)}
.btn-owned-active:hover{background:var(--accent);color:#fff}
.btn-wish{background:var(--bg3);border-color:var(--border2);color:var(--text2)}
.btn-wish:hover{border-color:var(--gold);color:var(--gold)}
.btn-wish-active{background:var(--bg3);border-color:var(--gold);color:var(--gold)}
.btn-wish-active:hover{background:var(--gold);color:#111}
.btn-close{background:var(--bg3);border-color:var(--border2);color:var(--text2);margin-left:auto}
.btn-close:hover{border-color:var(--border2);color:var(--text)}
#detail-purchase{margin-top:10px;display:none}
#detail-purchase label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px}
#detail-purchase input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:5px 10px;border-radius:var(--radius);font-size:12px;outline:none}
#detail-purchase input:focus{border-color:var(--accent)}
#detail-sections{padding:0 20px 20px;border-top:1px solid var(--border)}
.section-title{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;padding:14px 0 8px}
.musician-list{display:flex;flex-wrap:wrap;gap:6px}
.musician-tag{background:var(--bg3);border:1px solid var(--border);color:var(--text2);
  padding:3px 9px;border-radius:12px;font-size:11px;cursor:pointer;transition:all .15s}
.musician-tag:hover{border-color:var(--accent);color:var(--accent)}
.mb-link{display:inline-flex;align-items:center;gap:3px;color:var(--text3);font-size:11px;
  text-decoration:none;border-bottom:1px dotted var(--border2);padding-bottom:1px;transition:all .15s}
.mb-link:hover{color:var(--accent);border-bottom-color:var(--accent)}
.no-credits{font-size:11px;color:var(--text3);font-style:italic}
.related-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.related-card{background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:8px;cursor:pointer;transition:all .15s}
.related-card:hover{border-color:var(--border2);background:var(--bg4)}
.related-cover{width:100%;aspect-ratio:1;border-radius:2px;overflow:hidden;
  position:relative;margin-bottom:6px;background:var(--bg4)}
.related-cover img{width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .3s;position:absolute;inset:0}
.related-cover img.loaded{opacity:1}
.related-artist{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.related-title{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-weight:500}

/* ── ARTIST VIEW ── */
#artist-header{display:none;padding:12px 16px;background:var(--bg2);
  border-bottom:1px solid var(--border);align-items:center;gap:10px}
#artist-header.open{display:flex}
#artist-name-display{font-size:15px;font-weight:600;flex:1}
#artist-back{background:none;border:none;color:var(--text3);cursor:pointer;
  font-size:20px;line-height:1;padding:2px 6px;border-radius:3px}
#artist-back:hover{color:var(--text);background:var(--bg3)}

/* empty / loading */
#empty{display:none;padding:60px 20px;text-align:center;color:var(--text3)}
#empty.show{display:block}
#empty h2{font-size:16px;margin-bottom:8px;color:var(--text2)}
#loading-screen{position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading-screen.hidden{display:none}
.spinner{width:24px;height:24px;border:2px solid var(--border2);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{font-size:12px;color:var(--text3)}

/* ── TELEFONO ── */
#menu-btn,#scan-btn{display:none;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);border-radius:6px;width:36px;height:34px;cursor:pointer;flex:none;padding:0}
#scan-btn{display:inline-flex}
#scan-btn svg,#menu-btn svg{width:18px;height:18px}
#menu-scrim{display:none}
@media (max-width:720px){
  body{height:100vh;height:100dvh}
  #menu-btn{display:inline-flex}
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:150;transform:translateX(-100%);transition:transform .2s;
    box-shadow:none;padding-top:env(safe-area-inset-top)}
  body.menu-open #sidebar{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.6)}
  body.menu-open #menu-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:140}
  #topbar{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
  #results-info{display:none}
  #filter-bar{padding:6px 10px}
  #content{padding:10px}
  #album-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  #detail-overlay{padding:0}
  #detail-panel{max-height:100vh;max-height:100dvh;height:100%;border-radius:0;max-width:none}
  #detail-top{flex-direction:column;padding:14px}
  #detail-cover{width:60%;min-width:0;margin:0 auto}
  #live-page{padding:10px}
  #live-grid{grid-template-columns:1fr}
}
/* ── SCANSIONE ── */
#scan-overlay{position:fixed;inset:0;z-index:300;background:#000;display:none;flex-direction:column;overflow-y:auto;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#scan-overlay.open{display:flex}
#scan-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:var(--text);font-size:14px;font-weight:600}
#scan-close{background:none;border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer}
#scan-reader{width:100%;max-width:520px;margin:0 auto;min-height:0}
#scan-reader video{border-radius:8px}
#scan-hint{color:var(--text3);font-size:12px;text-align:center;padding:8px 14px}
#scan-manual{display:flex;gap:6px;padding:6px 14px;max-width:520px;width:100%;margin:0 auto}
#scan-manual input{flex:1;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:8px;font-size:16px}
#scan-manual button,.scan-btn2{background:var(--bg3);border:1px solid var(--border2);color:var(--accent);border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer}
#scan-result{padding:12px 14px 24px;max-width:520px;width:100%;margin:0 auto;color:var(--text)}
.sr-card{display:flex;gap:12px}
.sr-cover{width:110px;height:110px;flex:none;background:var(--bg3);border-radius:4px;overflow:hidden}
.sr-cover img{width:100%;height:100%;object-fit:cover;display:block}
.sr-title{font-size:17px;font-weight:600;line-height:1.2}
.sr-sub{color:var(--text2);font-size:13px;margin-top:3px}
.sr-cat{color:var(--text3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.sr-status{margin:12px 0 8px;font-size:14px;font-weight:600}
.sr-status.on{color:#4caf50}.sr-status.wish{color:var(--accent)}
.sr-actions{display:flex;gap:8px;flex-wrap:wrap}
.sr-line{margin-top:10px;font-size:13px;color:var(--text2);line-height:1.5}
.sr-line b{color:var(--text)}
.sr-links{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.sr-links a{color:var(--accent)}
/* ── ACCOUNT ── */
#account{padding:10px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.5}
#account input{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:4px;padding:5px 7px;font-size:11px;margin:5px 0}
#account button{background:none;border:1px solid var(--border2);color:var(--accent);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer}
#account button:hover{border-color:var(--accent)}
#account .acc-mail{color:var(--text2);word-break:break-all}
/* ── PAGINA ARTISTI IN CONCERTO ── */
#live-page{display:none;padding:16px;overflow-y:auto;flex:1}
#live-page.open{display:block}
.live-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.live-tools select{background:var(--bg2);color:var(--text);border:1px solid var(--border2);border-radius:5px;padding:5px 8px;font-size:12px}
.live-tools .live-n{font-size:12px;color:var(--text3)}
#live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.live-card{display:flex;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer}
.live-card:hover{border-color:var(--text3)}
.live-photo{width:64px;height:64px;border-radius:50%;flex:none;background:var(--bg3);object-fit:cover;display:flex;
  align-items:center;justify-content:center;font-size:22px;color:var(--text3);overflow:hidden}
.live-photo img{width:100%;height:100%;object-fit:cover}
.live-info{min-width:0;flex:1}
.live-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-next{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4}
.live-meta{font-size:11px;color:var(--text3);margin-top:3px}
.live-disco{margin-top:7px;background:none;border:1px solid var(--border2);color:var(--accent);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer}
.live-disco:hover{border-color:var(--accent)}
/* ── BIOGRAFIA ARTISTA ── */
#artist-bio{display:none;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);gap:14px;align-items:flex-start}
#artist-bio.open{display:flex}
#artist-bio img{width:96px;height:96px;object-fit:cover;border-radius:6px;flex:none;background:var(--bg3)}
#artist-bio .bio-body{min-width:0;flex:1}
#artist-bio .bio-text{font-size:13px;line-height:1.55;color:var(--text2);white-space:pre-line;cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#artist-bio .bio-text.open{display:block}
#artist-bio .bio-credit{font-size:10.5px;color:var(--text3);margin-top:6px;line-height:1.5}
#artist-bio .bio-credit a{color:inherit;text-decoration:underline dotted}
@media (max-width:600px){#artist-bio{flex-direction:column}#artist-bio img{width:72px;height:72px}}
/* ── LINGUE ── */
#lang-switch{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.lang-btn{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid var(--border2);
  color:var(--text3);border-radius:4px;padding:2px 5px;font-size:10px;cursor:pointer}
.lang-btn .flag{display:inline-block;width:16px;height:11px;line-height:0;border-radius:1px;overflow:hidden}
.lang-btn .flag svg{width:100%;height:100%;display:block}
.lang-btn:hover{color:var(--text);border-color:var(--text3)}
.lang-btn.active{color:var(--accent);border-color:var(--accent)}
/* ── COPERTINA INGRANDITA ── */
.album-cover img{transition:opacity .4s,transform .35s ease}
.album-card:hover .album-cover img{transform:scale(1.12)}
#detail-cover{cursor:zoom-in}
#detail-cover img{transition:opacity .3s,transform .35s ease}
#detail-cover:hover img{transform:scale(1.06)}
#lightbox{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:zoom-out;padding:16px}
#lightbox.open{display:flex}
#lightbox img{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:3px;
  box-shadow:0 10px 60px rgba(0,0,0,.8)}
#lightbox .lb-cap{color:#ccc;font-size:13px;text-align:center;max-width:90vw}
#lightbox .lb-cap small{display:block;color:#888;margin-top:2px}
#lightbox .lb-x{position:absolute;top:12px;right:18px;color:#aaa;font-size:30px;line-height:1}

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div id="loading-msg" data-i18n="loading">Caricamento catalogo…</div>
</div>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div id="sidebar-header">
    <h1>Nordicgrund</h1>
    <p data-i18n="personal">Catalogo personale</p>
    <div id="lang-switch"></div>
  </div>
  <div id="nav">
    <div class="nav-section" data-i18n="secCatalog">Catalogo</div>
    <button class="nav-btn active" onclick="setView('all')" id="nav-all">
      <span data-i18n="all">Tutto</span> <span class="nav-count" id="cnt-all">0</span>
    </button>
    <button class="nav-btn" onclick="setView('owned')" id="nav-owned">
      <span data-i18n="owned">Miei dischi</span> <span class="nav-count" id="cnt-owned">0</span>
    </button>
    <button class="nav-btn" onclick="setView('wishlist')" id="nav-wish">
      <span data-i18n="wishlist">Wishlist</span> <span class="nav-count" id="cnt-wish">0</span>
    </button>
    <div class="nav-section" style="margin-top:8px" data-i18n="secSeries">Serie</div>
    <button class="nav-btn" onclick="setView('series','ecm1')" id="nav-ecm1">
      ECM 1000 <span class="nav-count" id="cnt-ecm1">0</span>
    </button>
    <button class="nav-btn" onclick="setView('series','ecm2')" id="nav-ecm2">
      ECM 2000 <span class="nav-count" id="cnt-ecm2">0</span>
    </button>
    <button class="nav-btn" onclick="setView('series','ns')" id="nav-ns">
      ECM New Series <span class="nav-count" id="cnt-ns">0</span>
    </button>
    <button class="nav-btn" onclick="setView('series','works')" id="nav-works">
      Works <span class="nav-count" id="cnt-works">0</span>
    </button>
    <button class="nav-btn" onclick="setView('series','selected')" id="nav-selected">
      Selected Recordings <span class="nav-count" id="cnt-selected">0</span>
    </button>
    <div class="nav-section" style="margin-top:8px" data-i18n="secConcerts">Concerti</div>
    <button class="nav-btn" onclick="setView('live')" id="nav-live">
      <span data-i18n="artistsLive">Artisti in concerto</span> <span class="nav-count" id="cnt-live">0</span>
    </button>
  </div>
  <div id="account"></div>
  <div id="db-stats"></div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <button id="menu-btn" onclick="toggleMenu()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <input id="search" type="search" placeholder="Search" data-i18n-ph="search" oninput="onSearch(this.value)">
    <span id="results-info"></span>
    <button id="scan-btn" onclick="openScan()" aria-label="Scan" data-i18n-title="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/></svg></button>
  </div>
  <div id="filter-bar">
    <button class="filter-btn" id="fb-decade" onclick="toggleDecade()">Decade ▾</button>
    <div id="decade-pills" style="display:none;gap:5px;flex-wrap:wrap;display:none"></div>
    <select id="sort-select" onchange="onSort(this.value)">
      <option value="cat" data-i18n="sortCat">Catalogo</option>
      <option value="year" data-i18n="sortYear">Anno</option>
      <option value="artist" data-i18n="sortArtist">Artista</option>
      <option value="title" data-i18n="sortTitle">Titolo</option>
      <option value="next" data-i18n="sortNext">Prossimo concerto</option>
    </select>
  </div>
  <div id="artist-header">
    <button id="artist-back" onclick="clearArtist()">←</button>
    <span id="artist-name-display"></span>
  </div>
  <div id="artist-bio"></div>
  <div id="artist-concerts"></div>
  <div id="live-page"></div>
  <div id="content">
    <div id="album-grid"></div>
    <div id="empty"><h2 data-i18n="noResults">Nessun risultato</h2><p data-i18n="tryOther">Prova con altri termini di ricerca</p></div>
  </div>
</div>

<!-- DETAIL OVERLAY -->
<div id="detail-overlay" onclick="closeDetail(event)">
  <div id="detail-panel">
    <div id="detail-top">
      <div id="detail-cover">
        <div id="detail-cover-bg"><span id="detail-cover-num"></span></div>
        <img id="detail-cover-img" alt="" onload="this.classList.add('loaded')">
      </div>
      <div id="detail-meta">
        <div id="detail-cat"></div>
        <div id="detail-title"></div>
        <div id="detail-artist"></div>
        <div id="detail-year"></div>
        <div id="detail-musicians"></div>
        <div id="detail-notes"></div>
        <div class="detail-actions">
          <button class="btn" id="btn-owned" onclick="toggleOwned()"></button>
          <button class="btn btn-wish" id="btn-wish" onclick="toggleWish()">♡ Wishlist</button>
          <button class="btn btn-close" onclick="closeDetailDirect()">✕</button>
        </div>
        <div id="detail-purchase">
          <label data-i18n="purchaseDate">Data di acquisto</label>
          <input type="date" id="purchase-date-input" onchange="savePurchaseDate(this.value)">
        </div>
      </div>
    </div>
    <div id="detail-sections">
      <div id="concerts-section" style="display:none">
        <div class="section-title"><span data-i18n="upcoming">Prossimi concerti</span> <span id="concerts-count" style="color:var(--text3);font-weight:400"></span></div>
        <div class="concert-list" id="concert-list"></div>
        <div class="source-note" id="source-note-album"></div>
      </div>
      <div id="related-section" style="display:none">
        <div class="section-title"><span data-i18n="related">Album collegati</span> <span id="related-count" style="color:var(--text3);font-weight:400"></span></div>
        <div class="related-list" id="related-list"></div>
      </div>
      <div id="musicians-section" style="display:none">
        <div class="section-title" data-i18n="musicians">Musicisti</div>
        <div class="musician-list" id="musician-list"></div>
      </div>
      <div id="mb-links" style="display:none;flex-wrap:wrap;gap:6px 16px;padding-bottom:16px;border-top:1px solid var(--border);margin-top:14px"></div>
    </div>
  </div>
</div>

<div id="menu-scrim" onclick="toggleMenu()"></div>
<div id="scan-overlay">

</div>

//  ACCOUNT E SINCRONIZZAZIONE (collezione, wishlist, date di acquisto)
//  Accesso con link via email (Supabase Auth); i dati stanno nella tabella user_state
//  e ognuno vede solo i propri (RLS). Senza accesso tutto resta nel browser.
// ═══════════════════════════════════════════════════════════
const LS_SESSION = 'ng_session', LS_SYNCED = 'ng_synced_at', LS_DIRTY = 'ng_dirty';
let SESSION = null, pushTimer = null, syncMsg = '', mailSent = false;
try { SESSION = JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); } catch (e) {}

function saveSession(x) {
  SESSION = x;
  try { x ? localStorage.setItem(LS_SESSION, JSON.stringify(x)) : localStorage.removeItem(LS_SESSION); } catch (e) {}
}
function markDirty() {
  try { localStorage.setItem(LS_DIRTY, '1'); } catch (e) {}
  if (SESSION) { clearTimeout(pushTimer); pushTimer = setTimeout(pushState, 1500); }
}
function takeSessionFromUrl() {
  const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (!h.get('access_token')) return false;
  saveSession({
    access_token: h.get('access_token'), refresh_token: h.get('refresh_token'),
    expires_at: Math.floor(Date.now() / 1000) + parseInt(h.get('expires_in') || '3600', 10)
  });
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}
async function authToken() {
  if (!SESSION) return null;
  if (SESSION.expires_at - 60 < Date.now() / 1000) {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { apikey: SB_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: SESSION.refresh_token })
    });
    if (!r.ok) { saveSession(null); renderAccount(); return null; }
    const j = await r.json();
    saveSession({ ...SESSION, access_token: j.access_token, refresh_token: j.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: SESSION.email, user_id: SESSION.user_id });
  }
  return SESSION.access_token;
}
async function authFetch(path, opts) {
  const tok = await authToken();
  if (!tok) throw new Error('no session');
  const o = opts || {};
  return fetch(SB_URL + path, { ...o, headers: { apikey: SB_ANON, Authorization: 'Bearer ' + tok,
    'Content-Type': 'application/json', ...(o.headers || {}) } });
}
async function loadUser() {
  const r = await authFetch('/auth/v1/user');
  if (!r.ok) throw new Error('user ' + r.status);
  const u = await r.json();
  saveSession({ ...SESSION, email: u.email, user_id: u.id });
}
async function sendLink(email) {
  const r = await fetch(SB_URL + '/auth/v1/otp?redirect_to=' + encodeURIComponent(location.origin + location.pathname), {
    method: 'POST', headers: { apikey: SB_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, create_user: true })
  });
  if (!r.ok) throw new Error('otp ' + r.status);
}
function signOut() { saveSession(null); try { localStorage.removeItem(LS_SYNCED); } catch (e) {} syncMsg = ''; renderAccount(); }

function submitSignIn(ev) {
  ev.preventDefault();
  const email = document.getElementById('acc-email').value.trim();
  if (!email) return;
  sendLink(email).then(() => { mailSent = true; syncMsg = ''; renderAccount(); })
    .catch(() => { syncMsg = t('syncErr'); renderAccount(); });
}
function renderAccount() {
  const box = document.getElementById('account');
  if (!box) return;
  if (SESSION && SESSION.email) {
    box.innerHTML = `${esc(t('syncedAs'))}<br><span class="acc-mail">${esc(SESSION.email)}</span>` +
      (syncMsg ? `<br>${esc(syncMsg)}` : '') + `<br><button onclick="signOut()" style="margin-top:6px">${esc(t('signOut'))}</button>`;
  } else if (mailSent) {
    box.innerHTML = esc(t('linkSent'));
  } else {
    box.innerHTML = `<form onsubmit="submitSignIn(event)">${esc(t('signIn'))}` +
      `<input id="acc-email" type="email" required placeholder="${esc(t('emailPh'))}" autocomplete="email">` +
      `<button type="submit">${esc(t('sendLink'))}</button></form>` + (syncMsg ? `<br>${esc(syncMsg)}` : '');
  }
}

function mergeUnion(a, b) { return { ...(a || {}), ...(b || {}) }; }
async function pushState() {
  if (!SESSION || !SESSION.user_id) return;
  const now = new Date().toISOString();
  try {
    const r = await authFetch('/rest/v1/user_state?on_conflict=user_id', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_id: SESSION.user_id, owned: getOwned(), wishlist: getWishlist(), dates: getDates(), updated_at: now })
    });
    if (!r.ok) throw new Error('push ' + r.status);
    localStorage.setItem(LS_SYNCED, now); localStorage.removeItem(LS_DIRTY);
    syncMsg = ''; renderAccount();
  } catch (e) { syncMsg = t('syncErr'); renderAccount(); }
}
async function pullState() {
  if (!SESSION) return;
  try {
    if (!SESSION.user_id) await loadUser();
    const r = await authFetch('/rest/v1/user_state?select=owned,wishlist,dates,updated_at&user_id=eq.' + SESSION.user_id);
    if (!r.ok) throw new Error('pull ' + r.status);
    const rows = await r.json();
    const row = rows[0];
    const synced = localStorage.getItem(LS_SYNCED), dirty = localStorage.getItem(LS_DIRTY);
    if (!row) { await pushState(); renderAccount(); return; }
    if (!synced) {                       // primo accesso su questo dispositivo: unisce
      localStorage.setItem(LS_OWNED,    JSON.stringify(mergeUnion(row.owned, getOwned())));
      localStorage.setItem(LS_WISHLIST, JSON.stringify(mergeUnion(row.wishlist, getWishlist())));
      localStorage.setItem(LS_DATES,    JSON.stringify(mergeUnion(row.dates, getDates())));
      await pushState();
    } else if (dirty) {
      await pushState();
    } else if (row.updated_at > synced) { // un altro dispositivo ha modificato: prende il server
      localStorage.setItem(LS_OWNED,    JSON.stringify(row.owned || {}));
      localStorage.setItem(LS_WISHLIST, JSON.stringify(row.wishlist || {}));
      localStorage.setItem(LS_DATES,    JSON.stringify(row.dates || {}));
      localStorage.setItem(LS_SYNCED, row.updated_at);
    }
    renderAccount();
    if (typeof ALBUMS !== 'undefined' && ALBUMS.length) { updateCounts(); applyFilters(); }
  } catch (e) { syncMsg = t('syncErr'); renderAccount(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && SESSION && !localStorage.getItem(LS_DIRTY)) pullState(); });

async function loadAlbums() {
  const msg = document.getElementById('loading-msg');
  const all = [];
  const PAGE = 1000;
  let offset = 0;
  while (true) {
    msg.textContent = t('loadingN', { n: all.length });
    const batch = await sbGet(
      `/rest/v1/albums?select=id,catalog,year,artist,artist_list,title,notes,series,musicians,musician_list,cover_url,cover_ok,mbid,rg_mbid,ean,dist_catno`
      + `&order=catalog&limit=${PAGE}&offset=${offset}`
    );
    if (!Array.isArray(batch) || batch.length === 0) break;
    all.push(...batch);
    if (batch.length < PAGE) break;
    offset += PAGE;
  }
  // map DB rows → app format
  return all.map(r => ({
    id:           r.id,
    catalog:      r.catalog || r.id,
    year:         r.year || '',
    artist:       r.artist || '',
    artistList:   r.artist_list || [],
    title:        r.title || '',
    notes:        r.notes || '',
    series:       r.series || '',
    musicians:    r.musicians || '',
    musicianList: r.musician_list || [],
    cover_url:    r.cover_url || null,
    cover_ok:     r.cover_ok || false,
    mbid:         r.mbid || null,
    rg_mbid:      r.rg_mbid || null,
    ean:          r.ean || [],
    distCatno:    r.dist_catno || [],
  }));
}

function applyFilters() {
  const owned    = getOwned();
  const wishlist = getWishlist();
  const q = currentSearch.toLowerCase();

  filtered = ALBUMS.filter(a => {
    if (currentView === 'owned'    && !owned[a.id])    return false;
    if (currentView === 'wishlist' && !wishlist[a.id]) return false;
    if (currentView === 'series'   && !seriesMatch(a, currentSeries)) return false;
    if ((currentView === 'all' || currentView === 'live') && !currentArtist && !q && compKind(a)) return false;
    if (currentView === 'live'     && !albumLive(a).lead.length) return false;
    if (currentArtist && !artistMatch(a, currentArtist)) return false;
    if (activeDecade !== null) {
      const y = parseInt(a.year);
      if (isNaN(y) || Math.floor(y / 10) * 10 !== activeDecade) return false;
    }
    if (q) {
      const hay = (a.catalog + ' ' + a.artist + ' ' + a.title + ' ' + a.musicians).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const livePage = currentView === 'live' && !currentArtist;
  document.getElementById('live-page').classList.toggle('open', livePage);
  document.getElementById('content').style.display = livePage ? 'none' : '';
  if (livePage) renderLivePage();
  sortFiltered();
  if (!livePage) renderGrid();
  updateInfo();
  updateNavActive();
}

// Raccolte fuori dalla numerazione ECM: "Works" e "Selected Recordings" (rarum).
function compKind(a) {
  if (a._comp !== undefined) return a._comp;
  const cat = a.catalog || '', t = a.title || '';
  let k = null;
  if (!/^(ECM|JAPO)\s*\d/i.test(cat)) {
    if (/^rarum/i.test(cat) || /^Selected Recordings/i.test(t)) k = 'selected';
    else if (/^Works\b/i.test(t)) k = 'works';
  }
  return (a._comp = k);
}

function seriesMatch(a, key) {
  const cat = (a.catalog || '').toUpperCase();
  const n   = parseInt((cat.match(/\d+/) || [0])[0]);
  if (key === 'ecm1') return /^ECM/.test(cat) && n >= 1000 && n < 2000;
  if (key === 'ecm2') return /^ECM/.test(cat) && n >= 2000;
  if (key === 'ns')   return /NEW.?SERIES/i.test(a.series || '') || /^ECM\s*NS/i.test(cat);
  if (key === 'japo') return /^JAPO/i.test(cat);
  if (key === 'works' || key === 'selected') return compKind(a) === key;
  return false;
}

function people(a) {
  if (a._people) return a._people;
  const s = new Set();
  (Array.isArray(a.artistList) ? a.artistList : []).forEach(n => n && s.add(n.trim()));
  (Array.isArray(a.musicianList) ? a.musicianList : []).forEach(n => n && s.add(n.trim()));
  if (!s.size && a.artist) {
    a.artist.split(/\s*(?:\/|,|&|\band\b|\be\b|\bwith\b)\s*/i).forEach(n => n && s.add(n.trim()));
  }
  return (a._people = s);
}

function artistMatch(a, name) {
  return a.artist === name || people(a).has(name);
}

// ═══════════════════════════════════════════════════════════
//  CONCERTI (logica di abbinamento in concerts_match.js)
// ═══════════════════════════════════════════════════════════
function linkAllConcerts() {
  LIVE = linkConcerts(CONCERTS, buildNameIndex(ALBUMS, people));
  ALBUMS.forEach(a => { a._live = null; });
}

// Concerti collegati a un album.
//   all:  suona l'artista o uno dei musicisti del disco (omaggi compresi)
//   lead: suona l'artista del disco, esclusi gli omaggi -> illumina la copertina
function albumLive(a) {
  if (a._live) return a._live;
  const leadNames = (Array.isArray(a.artistList) && a.artistList.length) ? a.artistList : [a.artist];
  const leadKeys = new Set();
  leadNames.forEach(n => nameKeys(n).forEach(k => leadKeys.add(k)));
  const all = new Map();
  for (const p of people(a)) for (const c of concertsForName(p, LIVE)) all.set(c.id, c);
  const list = [...all.values()].sort((x, y) => x.date.localeCompare(y.date));
  const lead = list.filter(c => c.matches.some(m => leadKeys.has(m.key) && !m.tribute));
  return (a._live = { all: list, lead, leadKeys });
}

// ── Pagina "Artisti in concerto": un artista per scheda, con filtro per paese ──
let liveCountry = '';
function liveArtists() {
  if (LIVE_ART && LIVE_ART.src === CONCERTS) return LIVE_ART.list;
  const m = new Map();
  for (const c of CONCERTS) for (const x of (c.matches || [])) {
    if (x.tribute || !x.name) continue;
    if (!m.has(x.name)) m.set(x.name, new Map());
    m.get(x.name).set(c.id, c);
  }
  const list = [...m].map(([name, cs]) => ({ name, concerts: [...cs.values()].sort((a, b) => a.date.localeCompare(b.date)) }))
    .sort((a, b) => a.concerts[0].date.localeCompare(b.concerts[0].date) || a.name.localeCompare(b.name));
  LIVE_ART = { src: CONCERTS, list };
  return list;
}
let LIVE_ART = null;
function setLiveCountry(v) { liveCountry = v; renderLivePage(); }
function discoCount(name) { return ALBUMS.filter(a => artistMatch(a, name)).length; }
function renderLivePage() {
  const box = document.getElementById('live-page');
  const q = currentSearch.toLowerCase();
  const all = liveArtists();
  const countries = new Map();
  all.forEach(a => new Set(a.concerts.map(c => c.country).filter(Boolean)).forEach(k => countries.set(k, (countries.get(k) || 0) + 1)));
  if (liveCountry && !countries.has(liveCountry)) liveCountry = '';
  const list = all.filter(a => (!liveCountry || a.concerts.some(c => c.country === liveCountry)) && (!q || a.name.toLowerCase().includes(q)));
  const opts = `<option value="">${esc(t('allCountries'))}</option>` +
    [...countries].sort((a, b) => a[0].localeCompare(b[0])).map(([k, n]) =>
      `<option value="${esc(k)}"${k === liveCountry ? ' selected' : ''}>${esc(k)} (${n})</option>`).join('');
  box.innerHTML = `<div class="live-tools"><select onchange="setLiveCountry(this.value)">${opts}</select>` +
    `<span class="live-n">${esc(t('nArtists', { n: list.length }))}</span></div><div id="live-grid">` +
    list.map(a => {
      const sel = liveCountry ? a.concerts.filter(c => c.country === liveCountry) : a.concerts;
      const c = sel[0], r = ARTISTS[a.name], dn = discoCount(a.name);
      const ph = r && r.photo_url ? `<img src="${esc(r.photo_url)}" alt="" loading="lazy">` : esc(a.name.charAt(0));
      const nm = esc(a.name).replace(/'/g, '&#39;');
      return `<div class="live-card" onclick="filterByArtist('${nm}')">` +
        `<div class="live-photo">${ph}</div><div class="live-info"><div class="live-name">${esc(a.name)}</div>` +
        `<div class="live-next">${esc(t('nextLabel'))}${esc(fmtConcertDate(c.date))}, ${esc(concertPlace(c))}</div>` +
        `<div class="live-meta">${esc(t('nConcerts', { n: sel.length }))}</div>` +
        (dn ? `<button class="live-disco" onclick="event.stopPropagation();filterByArtist('${nm}')">${esc(t('discography', { n: dn }))}</button>` : '') +
        `</div></div>`;
    }).join('') + '</div>';
}

let scanner = null, scanLibPromise = null, lastScanAlbum = null;
function loadScanLib() {
  if (window.Html5Qrcode) return Promise.resolve();
  if (!scanLibPromise) scanLibPromise = new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    el.onload = res; el.onerror = () => { scanLibPromise = null; rej(new Error('lib')); };
    document.head.appendChild(el);
  });
  return scanLibPromise;
}
function openScan() {
  document.getElementById('scan-overlay').classList.add('open');
  document.getElementById('scan-result').innerHTML = '';
  document.getElementById('scan-hint').textContent = t('scanHint');
  startScan();
}
async function startScan() {
  try {
    await loadScanLib();
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('scan-reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], verbose: false });
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 280, height: 140 } },
      txt => { stopScan(); handleCode(txt); }, () => {});
  } catch (e) {
    document.getElementById('scan-hint').textContent = t('scanCamErr');
  }
}
async function stopScan() {
  const sc = scanner; scanner = null;
  if (sc) { try { await sc.stop(); sc.clear(); } catch (e) {} }
}
function closeScan() { stopScan(); document.getElementById('scan-overlay').classList.remove('open'); }
function scanManual(ev) {
  ev.preventDefault();
  const c = document.getElementById('scan-code').value;
  if (c.replace(/\D/g, '').length >= 8) { stopScan(); handleCode(c); }
}

// EAN a 13 cifre (gli UPC a 12 cifre prendono lo zero iniziale)
function normEan(c) { c = String(c || '').replace(/\D/g, ''); return c.length === 12 ? '0' + c : c; }
// Codici PolyGram: prefisso 73145 / 04228 + ultime 5 cifre del numero di distribuzione + "2" + controllo
function distFive(e13) {
  const u = e13.slice(1);
  return (u.length === 12 && (u.slice(0, 5) === '73145' || u.slice(0, 5) === '04228') && u[10] === '2') ? u.slice(5, 10) : null;
}
function findByEan(code) {
  const e = normEan(code);
  let a = ALBUMS.find(x => (x.ean || []).includes(e));
  if (a) return a;
  const five = distFive(e);
  if (five) a = ALBUMS.find(x => (x.distCatno || []).some(d => d.replace(/\D/g, '').slice(1, 6) === five));
  return a || null;
}
// Affinità: quanti musicisti del disco compaiono nei dischi che possiedi o hai in wishlist
function tasteFor(a) {
  const owned = getOwned(), wish = getWishlist();
  const cnt = new Map();
  ALBUMS.forEach(x => {
    if (x.id === a.id || !(owned[x.id] || wish[x.id])) return;
    const w = owned[x.id] ? 1 : 0.5;
    people(x).forEach(n => cnt.set(n, (cnt.get(n) || 0) + w));
  });
  const ps = [...people(a)];
  const shared = ps.filter(n => cnt.has(n)).sort((x, y) => cnt.get(y) - cnt.get(x));
  const score = ps.length ? Math.round(100 * shared.reduce((s, n) => s + Math.min(1, cnt.get(n) / 3), 0) / ps.length) : 0;
  return { score, shared: shared.slice(0, 4), n: shared.length };
}
async function mbRating(a) {
  if (!a.rg_mbid) return null;
  try {
    const r = await fetch('https://musicbrainz.org/ws/2/release-group/' + a.rg_mbid + '?inc=ratings&fmt=json');
    if (!r.ok) return null;
    const j = await r.json();
    return j.rating && j.rating.value ? j.rating : null;
  } catch (e) { return null; }
}
function scanToggle(kind) {
  if (!lastScanAlbum) return;
  quickToggle({ stopPropagation() {} }, lastScanAlbum.id, kind);
  showScanAlbum(lastScanAlbum, true);
}
function scanStatusHtml(a) {
  const o = getOwned()[a.id], w = getWishlist()[a.id];
  return `<div class="sr-status ${o ? 'on' : w ? 'wish' : ''}">${esc(t(o ? 'scanOwned' : w ? 'scanWish' : 'scanNone'))}</div>` +
    `<div class="sr-actions"><button class="scan-btn2" onclick="scanToggle('owned')">${esc(o ? '✓ ' : '+ ')}${esc(t('scanAddOwned'))}</button>` +
    `<button class="scan-btn2" onclick="scanToggle('wish')">${esc(w ? '♡ ' : '+ ')}${esc(t('scanAddWish'))}</button></div>`;
}
function showScanAlbum(a, keepRating) {
  lastScanAlbum = a;
  const tf = tasteFor(a);
  const box = document.getElementById('scan-result');
  const prevR = keepRating ? (document.getElementById('sr-rating') || {}).innerHTML : '';
  box.innerHTML =
    `<div class="sr-card"><div class="sr-cover">${a.cover_url ? `<img src="${esc(a.cover_url)}" alt="">` : ''}</div>` +
    `<div><div class="sr-title">${esc(a.title)}</div><div class="sr-sub">${esc(a.artist)} · ${esc(a.year)}</div>` +
    `<div class="sr-cat">${esc(a.catalog)}</div></div></div>` +
    scanStatusHtml(a) +
    `<div class="sr-line"><b>${esc(t('scanTaste'))}: ${tf.score}%</b><br>` +
    (tf.n ? esc(tf.n + ' ' + t('scanShared') + ': ' + tf.shared.join(', ')) : esc(t('scanNoShared'))) + `</div>` +
    `<div class="sr-line" id="sr-rating">${prevR || ''}</div>` +
    `<div class="sr-links"><a href="#" onclick="closeScan();openDetail('${esc(a.id)}');return false">${esc(a.catalog)} ›</a>` +
    `<a href="https://www.discogs.com/search/?q=${encodeURIComponent(a.artist + ' ' + a.title)}&type=release" target="_blank" rel="noopener">${esc(t('scanDiscogs'))}</a>` +
    (a.rg_mbid ? `<a href="https://musicbrainz.org/release-group/${esc(a.rg_mbid)}" target="_blank" rel="noopener">MusicBrainz</a>` : '') + `</div>` +
    `<div class="sr-actions" style="margin-top:14px"><button class="scan-btn2" onclick="openScan()">${esc(t('scanReopen'))}</button></div>`;
  if (!keepRating) mbRating(a).then(r => {
    const el = document.getElementById('sr-rating');
    if (el && lastScanAlbum === a) el.innerHTML = r
      ? `<b>${esc(t('scanRating'))}: ${(+r.value).toFixed(1)}/5</b> (${r['votes-count']} ${esc(t('scanVotes'))})`
      : esc(t('scanNoRating'));
  });
}
function handleCode(code) {
  const a = findByEan(code);
  if (a) { showScanAlbum(a); return; }
  lastScanAlbum = null;
  document.getElementById('scan-result').innerHTML =
    `<div class="sr-status">${esc(t('scanNotFound'))}</div><div class="sr-sub">${esc(t('scanCode'))}${esc(normEan(code))}</div>` +
    `<div class="sr-links"><a href="https://www.discogs.com/search/?q=${encodeURIComponent(normEan(code))}&type=release" target="_blank" rel="noopener">${esc(t('scanDiscogs'))}</a></div>` +
    `<div class="sr-actions" style="margin-top:14px"><button class="scan-btn2" onclick="openScan()">${esc(t('scanReopen'))}</button></div>`;
}

function personLive(name) {
  return LIVE.size ? concertsForName(name, LIVE) : [];
}

function fmtConcertDate(iso, withYear) {
  const d = new Date(iso + 'T12:00:00');
  const s = d.toLocaleDateString(t('locale'), { weekday: 'short', day: 'numeric', month: 'short' });
  return (withYear || d.getFullYear() !== new Date().getFullYear()) ? `${s} ${d.getFullYear()}` : s;
}

function concertPlace(c) {
  return [c.city, c.country].filter(Boolean).join(', ');
}

function liveTitle(list) {
  const n = list.length, c = list[0];
  return t(n === 1 ? 'liveOne' : 'liveMany', { n, date: fmtConcertDate(c.date), place: concertPlace(c) });
}

// Una riga di concerto. keys: chiavi dei nomi da mettere in evidenza (album o artista aperto).
function concertRow(c, keys) {
  const mine = c.matches.filter(m => !keys || keys.has(m.key));
  const tribute = mine.length && mine.every(m => m.tribute);
  const headKey = ' ' + normName(c.artist) + ' ';
  const withNames = mine.filter(m => !headKey.includes(' ' + m.key + ' ')).map(m => m.name);
  const info = String(c.info || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 2).join(' · ');
  const where = [c.venue && c.venue !== 'tba' ? c.venue : '', concertPlace(c)].filter(Boolean).join(' — ');
  const link = /^https?:\/\//i.test(c.url || '')
    ? `<a class="mb-link" href="${esc(c.url)}" target="_blank" rel="noopener">Info ↗</a>` : '';
  return `<div class="concert-row">
    <span class="concert-date">${esc(fmtConcertDate(c.date))}</span>
    <div class="concert-body">
      <div class="concert-what">${esc(c.artist)}${tribute ? `<span class="concert-tag">${esc(t('tribute'))}</span>` : ''}</div>
      ${withNames.length ? `<div class="concert-with">${esc(t('withNames', { names: withNames.join(', ') }))}</div>` : ''}
      ${info ? `<div class="concert-info">${esc(info)}</div>` : ''}
      <div class="concert-where">${esc(where)}</div>
    </div>
    ${link}
  </div>`;
}

function concertListHtml(list, keys, max, moreId) {
  const shown = list.slice(0, max).map(c => concertRow(c, keys)).join('');
  const rest = list.length - max;
  return shown + (rest > 0
    ? `<button class="concert-more" onclick="${moreId}">${esc(rest === 1 ? t('moreOne') : t('moreN', { n: rest }))}</button>`
    : '');
}

// Onclick sicuro per un nome (apostrofi e virgolette).
function jsName(n) {
  return esc(String(n).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
}

function sortFiltered() {
  filtered.sort((a, b) => {
    if (currentSort === 'year')   return (a.year || '0').localeCompare(b.year || '0');
    if (currentSort === 'artist') return a.artist.localeCompare(b.artist);
    if (currentSort === 'title')  return a.title.localeCompare(b.title);
    if (currentSort === 'next') {
      const na = (albumLive(a).lead[0] || albumLive(a).all[0] || {}).date || '9999';
      const nb = (albumLive(b).lead[0] || albumLive(b).all[0] || {}).date || '9999';
      if (na !== nb) return na.localeCompare(nb);
    }
    // cat: natural sort by number (le raccolte fuori numerazione in fondo)
    const ca = compKind(a) ? 1 : 0, cb = compKind(b) ? 1 : 0;
    if (ca !== cb) return ca - cb;
    const na = parseInt((a.catalog.match(/\d+/) || [0])[0]);
    const nb = parseInt((b.catalog.match(/\d+/) || [0])[0]);
    return na - nb;
  });
}

    return `<span class="musician-tag${lv.length ? ' live' : ''}" style="font-size:13px"`
      + (lv.length ? ` title="${esc(liveTitle(lv))}"` : '')
      + ` onclick="filterByArtist('${jsName(n)}')">${esc(n)}</span>`;
  }).join(' ');
  document.getElementById('detail-year').textContent      = a.year || '';
  document.getElementById('detail-musicians').textContent = a.musicians || '';
  document.getElementById('detail-notes').textContent     = a.notes || '';

  const img = document.getElementById('detail-cover-img');
  if (a.cover_url) {
    img.src = a.cover_url;
    img.style.display = '';
  } else {
    img.src = '';
    img.style.display = 'none';
  }

  // owned button
  const btnO = document.getElementById('btn-owned');
  if (owned[a.id]) {
    btnO.textContent = t('btnOwned');
    btnO.className = 'btn btn-owned-active';
    const dp = document.getElementById('detail-purchase');
    dp.style.display = 'block';
    document.getElementById('purchase-date-input').value = dates[a.id] || '';
  } else {
    btnO.textContent = t('btnAdd');
    btnO.className = 'btn btn-primary';
    document.getElementById('detail-purchase').style.display = 'none';
  }

  // wishlist button
  const btnW = document.getElementById('btn-wish');
  if (wishlist[a.id]) {
    btnW.textContent = t('btnWishOn');
    btnW.className = 'btn btn-wish-active';
  } else {
    btnW.textContent = '♡ ' + t('wishlist');
    btnW.className = 'btn btn-wish';
  }

  // musicians tags (from musicianList) or plain text (from musicians field)
  const ml = document.getElementById('musician-list');
  const ms = document.getElementById('musicians-section');
  const mTitle = ms.querySelector('.section-title');
  if (Array.isArray(a.musicianList) && a.musicianList.length) {
    mTitle.textContent = t('musicians');
    ml.innerHTML = a.musicianList.map(m => {
      const lv = personLive(m);
      return `<span class="musician-tag${lv.length ? ' live' : ''}"`
        + (lv.length ? ` title="${esc(liveTitle(lv))}"` : '')
        + ` onclick="filterByArtist('${jsName(m)}')">${esc(m)}</span>`;
    }).join('');
    ms.style.display = 'block';
  } else if (a.musicians) {
    mTitle.textContent = t('musicians');
    ml.innerHTML = `<span style="font-size:11px;color:var(--text2);line-height:1.6">${esc(a.musicians)}</span>`;
    ms.style.display = 'block';
  } else {
    mTitle.textContent = t('musicians');
    ml.innerHTML = `<span class="no-credits">${esc(t('noCredits'))}</span>`;
    ms.style.display = 'block';
  }

  // MusicBrainz links
  const mbSection = document.getElementById('mb-links');
  if (a.mbid || a.rg_mbid) {
    let links = '';
    if (a.rg_mbid) links += `<a class="mb-link" href="https://musicbrainz.org/release-group/${a.rg_mbid}" target="_blank" rel="noopener">MusicBrainz ↗</a>`;
    if (a.mbid)    links += `<a class="mb-link" href="https://musicbrainz.org/release/${a.mbid}" target="_blank" rel="noopener">Release ↗</a>`;
    if (a.rg_mbid) links += `<a class="mb-link" href="https://coverartarchive.org/release-group/${a.rg_mbid}" target="_blank" rel="noopener">Cover Art ↗</a>`;
    mbSection.innerHTML = '<div class="section-title" style="width:100%;padding-bottom:2px">' + esc(t('extLinks')) + '</div>' + links;
    mbSection.style.display = 'flex';
  } else {
    mbSection.style.display = 'none';
  }

  // concerti dell'artista e dei musicisti del disco
  renderAlbumConcerts(false);

  // related (shared musicians)
  renderRelated(a);
}

function renderAlbumConcerts(showAll) {
  const a = openAlbum;
  const sec = document.getElementById('concerts-section');
  if (!a) return;
  const lv = albumLive(a);
  if (!lv.all.length) { sec.style.display = 'none'; return; }
  const keys = new Set();
  people(a).forEach(p => nameKeys(p).forEach(k => keys.add(k)));
  // prima i concerti dell'artista del disco, poi quelli dei soli musicisti
  const leadIds = new Set(lv.lead.map(c => c.id));
  const list = [...lv.lead, ...lv.all.filter(c => !leadIds.has(c.id))];
  document.getElementById('concerts-count').textContent = `(${list.length})`;
  document.getElementById('concert-list').innerHTML =
    concertListHtml(list, keys, showAll ? list.length : 5, 'renderAlbumConcerts(true)');
  sec.style.display = 'block';
}

function renderRelated(a) {
  const section = document.getElementById('related-section');
  const mine = people(a);
  if (!mine.size) { section.style.display = 'none'; return; }
  const related = ALBUMS
    .filter(b => b.id !== a.id)
    .map(b => ({ b, n: [...people(b)].filter(p => mine.has(p)).length }))
    .filter(x => x.n > 0)
    .sort((x, y) => y.n - x.n || (x.b.year || '').localeCompare(y.b.year || ''))
    .slice(0, 24)
    .map(x => x.b);

  if (!related.length) { section.style.display = 'none'; return; }

  document.getElementById('related-count').textContent = `(${related.length})`;
  document.getElementById('related-list').innerHTML = related.map(b => {
    const cover = b.cover_url
      ? `<img src="${b.cover_url}" loading="lazy" alt="" onload="this.classList.add('loaded')">`
      : '';
    return `<div class="related-card" onclick="openDetail('${esc(b.id)}')">
      <div class="related-cover">${cover}</div>
      <div class="related-artist">${esc(b.artist)}</div>
      <div class="related-title">${esc(b.title)}</div>
    </div>`;
  }).join('');
  section.style.display = 'block';
}

function closeDetail(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetailDirect();
}
function closeDetailDirect() {
  document.getElementById('detail-overlay').classList.remove('open');
  openAlbum = null;
}

// ═══════════════════════════════════════════════════════════
//  OWNED / WISHLIST TOGGLE
// ═══════════════════════════════════════════════════════════
function toggleOwned() {
  if (!openAlbum) return;
  const owned = getOwned();
  owned[openAlbum.id] = !owned[openAlbum.id];
  if (!owned[openAlbum.id]) delete owned[openAlbum.id];
  saveOwned(owned);
  updateCounts();
  renderDetail();
  applyFilters();
}

function toggleWish() {
  if (!openAlbum) return;
  const wish = getWishlist();
  wish[openAlbum.id] = !wish[openAlbum.id];
  if (!wish[openAlbum.id]) delete wish[openAlbum.id];
  saveWishlist(wish);
  updateCounts();
  renderDetail();
  applyFilters();
}

function savePurchaseDate(val) {
  if (!openAlbum) return;
  const dates = getDates();
  if (val) dates[openAlbum.id] = val;
  else delete dates[openAlbum.id];
  saveDates(dates);
}

// ── azioni rapide sulla copertina nella griglia ──
function quickToggle(ev, id, kind) {
  ev.stopPropagation();
  const o = kind === 'owned' ? getOwned() : getWishlist();
  o[id] = !o[id];
  if (!o[id]) delete o[id];
  if (kind === 'owned') saveOwned(o); else saveWishlist(o);
  updateCounts();
  if (currentView === 'owned' || currentView === 'wishlist') applyFilters(); else renderGrid();
}
function quickZoom(ev, id) {
  ev.stopPropagation();
  const a = ALBUMS.find(x => x.id === id);
  if (!a || !a.cover_url) return;
  document.getElementById('lb-img').src = a.cover_url;
  document.getElementById('lb-cap').innerHTML =
    `${esc(a.title)}<small>${esc(a.artist)} · ${esc(a.catalog)} ${esc(a.year)}</small>`;
  document.getElementById('lightbox').classList.add('open');
}

// ── copertina a tutto schermo ──
function openLightbox() {
  const src = document.getElementById('detail-cover-img').getAttribute('src');
  if (!src) return;
  document.getElementById('lb-img').src = src;
  const t = id => (document.getElementById(id) || {}).textContent || '';
  document.getElementById('lb-cap').innerHTML =
    `${esc(t('detail-title'))}<small>${esc(t('detail-artist'))} · ${esc(t('detail-cat'))} ${esc(t('detail-year'))}</small>`;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.getElementById('detail-cover').addEventListener('click', openLightbox);

// keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) { closeLightbox(); return; }
  if (e.key === 'Escape') closeDetailDirect();
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// ═══════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════
takeSessionFromUrl();
applyStaticI18n();
renderAccount();
init();
</script>
