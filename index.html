<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECM Records Catalog</title>
<style>
:root {
  --bg:#0a0a0a; --bg2:#111; --bg3:#181818; --bg4:#1e1e1e;
  --border:#2a2a2a; --border2:#333;
  --text:#e8e8e8; --text2:#aaa; --text3:#666;
  --accent:#4a9eff; --accent2:#2d7adb;
  --gold:#c9a84c; --gold2:#a8893e;
  --red:#c0392b;
  --radius:4px;
  --sidebar:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
     font-size:13px;display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
#sidebar-header h1{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
#sidebar-header p{font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
#nav{flex:1;overflow-y:auto;padding:8px 0}
#nav::-webkit-scrollbar{width:4px}
#nav::-webkit-scrollbar-thumb{background:var(--border2)}
.nav-section{padding:10px 16px 4px;font-size:10px;color:var(--text3);
  letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.nav-btn{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--text2);padding:6px 16px;cursor:pointer;font-size:12px;
  border-left:2px solid transparent;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{color:var(--accent);border-left-color:var(--accent);background:var(--bg3)}
.nav-count{float:right;font-size:10px;color:var(--text3);margin-top:1px}

#db-stats{padding:12px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);line-height:1.7}
#db-stats strong{color:var(--text2)}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--bg2);border-bottom:1px solid var(--border)}
#search{flex:1;background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:7px 12px;border-radius:var(--radius);font-size:13px;outline:none}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--text3)}
#filter-bar{display:flex;gap:6px;padding:8px 16px;background:var(--bg2);
  border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);
  padding:4px 10px;border-radius:var(--radius);cursor:pointer;font-size:11px;transition:all .15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
#sort-select{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);
  padding:4px 8px;border-radius:var(--radius);font-size:11px;cursor:pointer;outline:none;margin-left:auto}
#results-info{font-size:11px;color:var(--text3);padding:0 16px;white-space:nowrap}

/* ── GRID ── */
#content{flex:1;overflow-y:auto;padding:16px}
#content::-webkit-scrollbar{width:6px}
#content::-webkit-scrollbar-track{background:var(--bg)}
#content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.album-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  cursor:pointer;transition:all .2s;overflow:hidden;position:relative}
.album-card:hover{border-color:var(--border2);transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
.album-cover{width:100%;aspect-ratio:1;position:relative;overflow:hidden;background:var(--bg3)}
.album-cover img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;
  inset:0;opacity:0;transition:opacity .4s}
.album-cover img.loaded{opacity:1}
.album-cover-bg{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center}
.album-cover-num{font-size:9px;color:rgba(255,255,255,.25);letter-spacing:.05em;
  font-weight:600;text-transform:uppercase}
.album-info{padding:8px 10px}
.album-artist{font-size:10px;color:var(--text3);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-title{font-size:11px;color:var(--text);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-meta{display:flex;align-items:center;gap:4px;margin-top:4px}
.album-year{font-size:10px;color:var(--text3)}
.album-cat{font-size:9px;color:var(--text3);margin-left:auto;opacity:.6}
.ind{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ind-owned{background:var(--accent)}
.ind-wish{background:var(--gold)}

/* ── DETAIL PANEL ── */
#detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px}
#detail-overlay.open{display:flex}
#detail-panel{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
  width:100%;max-width:680px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column}
#detail-panel::-webkit-scrollbar{width:5px}
#detail-panel::-webkit-scrollbar-thumb{background:var(--border2)}
#detail-top{display:flex;gap:20px;padding:20px}
#detail-cover{width:160px;min-width:160px;aspect-ratio:1;border-radius:4px;overflow:hidden;
  position:relative;background:var(--bg3)}
#detail-cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;
  opacity:0;transition:opacity .3s}
#detail-cover img.loaded{opacity:1}
#detail-cover-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#detail-cover-num{font-size:11px;color:rgba(255,255,255,.2);letter-spacing:.06em;font-weight:600}
#detail-meta{flex:1}
#detail-cat{font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
#detail-title{font-size:20px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:8px}
#detail-artist{font-size:14px;color:var(--text2);margin-bottom:6px}
#detail-year{font-size:12px;color:var(--text3);margin-bottom:12px}
#detail-musicians{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}
#detail-notes{font-size:11px;color:var(--text3);font-style:italic;margin-bottom:12px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:var(--radius);border:1px solid;cursor:pointer;
  font-size:12px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-owned-active{background:var(--bg3);border-color:var(--accent);color:var(--accent)}
.btn-owned-active:hover{background:var(--accent);color:#fff}
.btn-wish{background:var(--bg3);border-color:var(--border2);color:var(--text2)}
.btn-wish:hover{border-color:var(--gold);color:var(--gold)}
.btn-wish-active{background:var(--bg3);border-color:var(--gold);color:var(--gold)}
.btn-wish-active:hover{background:var(--gold);color:#111}
.btn-close{background:var(--bg3);border-color:var(--border2);color:var(--text2);margin-left:auto}
.btn-close:hover{border-color:var(--border2);color:var(--text)}
#detail-purchase{margin-top:10px;display:none}
#detail-purchase label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px}
#detail-purchase input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:5px 10px;border-radius:var(--radius);font-size:12px;outline:none}
#detail-purchase input:focus{border-color:var(--accent)}
#detail-sections{padding:0 20px 20px;border-top:1px solid var(--border)}
.section-title{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;padding:14px 0 8px}
.musician-list{display:flex;flex-wrap:wrap;gap:6px}
.musician-tag{background:var(--bg3);border:1px solid var(--border);color:var(--text2);
  padding:3px 9px;border-radius:12px;font-size:11px;cursor:pointer;transition:all .15s}
.musician-tag:hover{border-color:var(--accent);color:var(--accent)}
.mb-link{display:inline-flex;align-items:center;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);padding:4px 10px;border-radius:var(--radius);font-size:11px;
  text-decoration:none;transition:all .15s}
.mb-link:hover{border-color:var(--accent);color:var(--accent)}
.related-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.related-card{background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:8px;cursor:pointer;transition:all .15s}
.related-card:hover{border-color:var(--border2);background:var(--bg4)}
.related-cover{width:100%;aspect-ratio:1;border-radius:2px;overflow:hidden;
  position:relative;margin-bottom:6px;background:var(--bg4)}
.related-cover img{width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .3s;position:absolute;inset:0}
.related-cover img.loaded{opacity:1}
.related-artist{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.related-title{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-weight:500}

/* ── ARTIST VIEW ── */
#artist-header{display:none;padding:12px 16px;background:var(--bg2);
  border-bottom:1px solid var(--border);align-items:center;gap:10px}
#artist-header.open{display:flex}
#artist-name-display{font-size:15px;font-weight:600;flex:1}
#artist-back{background:none;border:none;color:var(--text3);cursor:pointer;
  font-size:20px;line-height:1;padding:2px 6px;border-radius:3px}
#artist-back:hover{color:var(--text);background:var(--bg3)}

/* empty / loading */
#empty{display:none;padding:60px 20px;text-align:center;color:var(--text3)}
#empty.show{display:block}
#empty h2{font-size:16px;margin-bottom:8px;color:var(--text2)}
#loading-screen{position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading-screen.hidden{display:none}
.spinner{width:24px;height:24px;border:2px solid var(--border2);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{font-size:12px;color:var(--text3)}
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div id="loading-msg">Caricamento catalogo ECM…</div>
</div>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div id="sidebar-header">
    <h1>ECM Records</h1>
    <p>Catalogo personale</p>
  </div>
  <div id="nav">
    <div class="nav-section">Catalogo</div>
    <button class="nav-btn active" onclick="setView('all')" id="nav-all">
      Tutto <span class="nav-count" id="cnt-all">0</span>
    </button>
    <button class="nav-btn" onclick="setView('owned')" id="nav-owned">
      Miei dischi <span class="nav-count" id="cnt-owned">0</span>
    </button>
    <button class="nav-btn" onclick="setView('wishlist')" id="nav-wish">
      Wishlist <span class="nav-count" id="cnt-wish">0</span>
    </button>
    <div class="nav-section" style="margin-top:8px">Serie</div>
    <button class="nav-btn" onclick="setView('series','ecm1')" id="nav-ecm1">
      ECM 1000 <span class="nav-count" id="cnt-ecm1">0</span>
    </button>
    <button class="nav-btn" onclick="setView('series','ecm2')" id="nav-ecm2">
      ECM 2000 <span class="nav-count" id="cnt-ecm2">0</span>
    </button>
    <button class="nav-btn" onclick="setView('series','ns')" id="nav-ns">
      ECM New Series <span class="nav-count" id="cnt-ns">0</span>
    </button>
    <button class="nav-btn" onclick="setView('series','japo')" id="nav-japo">
      JAPO <span class="nav-count" id="cnt-japo">0</span>
    </button>
  </div>
  <div id="db-stats"></div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <input id="search" type="search" placeholder="Cerca artista, titolo, catalogo…" oninput="onSearch(this.value)">
    <span id="results-info"></span>
  </div>
  <div id="filter-bar">
    <button class="filter-btn" id="fb-decade" onclick="toggleDecade()">Decade ▾</button>
    <div id="decade-pills" style="display:none;gap:5px;flex-wrap:wrap;display:none"></div>
    <select id="sort-select" onchange="onSort(this.value)">
      <option value="cat">Catalogo</option>
      <option value="year">Anno</option>
      <option value="artist">Artista</option>
      <option value="title">Titolo</option>
    </select>
  </div>
  <div id="artist-header">
    <button id="artist-back" onclick="clearArtist()">←</button>
    <span id="artist-name-display"></span>
  </div>
  <div id="content">
    <div id="album-grid"></div>
    <div id="empty"><h2>Nessun risultato</h2><p>Prova con altri termini di ricerca</p></div>
  </div>
</div>

<!-- DETAIL OVERLAY -->
<div id="detail-overlay" onclick="closeDetail(event)">
  <div id="detail-panel">
    <div id="detail-top">
      <div id="detail-cover">
        <div id="detail-cover-bg"><span id="detail-cover-num"></span></div>
        <img id="detail-cover-img" alt="" onload="this.classList.add('loaded')">
      </div>
      <div id="detail-meta">
        <div id="detail-cat"></div>
        <div id="detail-title"></div>
        <div id="detail-artist"></div>
        <div id="detail-year"></div>
        <div id="detail-musicians"></div>
        <div id="detail-notes"></div>
        <div class="detail-actions">
          <button class="btn" id="btn-owned" onclick="toggleOwned()"></button>
          <button class="btn btn-wish" id="btn-wish" onclick="toggleWish()">♡ Wishlist</button>
          <button class="btn btn-close" onclick="closeDetailDirect()">✕</button>
        </div>
        <div id="detail-purchase">
          <label>Data di acquisto</label>
          <input type="date" id="purchase-date-input" onchange="savePurchaseDate(this.value)">
        </div>
      </div>
    </div>
    <div id="detail-sections">
      <div id="related-section" style="display:none">
        <div class="section-title">Album collegati <span id="related-count" style="color:var(--text3);font-weight:400"></span></div>
        <div class="related-list" id="related-list"></div>
      </div>
      <div id="musicians-section" style="display:none">
        <div class="section-title">Musicisti</div>
        <div class="musician-list" id="musician-list"></div>
      </div>
      <div id="mb-links" style="display:none;flex-wrap:wrap;gap:6px;padding-bottom:16px"></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════
const SB_URL  = 'https://clkrsdddcrwbajlcieug.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsa3JzZGRkY3J3YmFqbGNpZXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0Nzk4MDMsImV4cCI6MjEwODA1NTgwM30.tca-MEzvmLIbspN_6S7KvuEBUv_CdfXxSgKfDG6_x0E';

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let ALBUMS     = [];
let filtered   = [];
let currentView = 'all';
let currentSeries = null;
let currentArtist = null;
let currentSearch = '';
let currentSort   = 'cat';
let decadeOpen    = false;
let activeDecade  = null;
let openAlbum     = null;

// localStorage keys
const LS_OWNED    = 'ecm_owned_v2';
const LS_WISHLIST = 'ecm_wish_v2';
const LS_DATES    = 'ecm_dates_v2';

function getOwned()    { try { return JSON.parse(localStorage.getItem(LS_OWNED)    || '{}'); } catch { return {}; } }
function getWishlist() { try { return JSON.parse(localStorage.getItem(LS_WISHLIST) || '{}'); } catch { return {}; } }
function getDates()    { try { return JSON.parse(localStorage.getItem(LS_DATES)    || '{}'); } catch { return {}; } }
function saveOwned(o)    { localStorage.setItem(LS_OWNED,    JSON.stringify(o)); }
function saveWishlist(w) { localStorage.setItem(LS_WISHLIST, JSON.stringify(w)); }
function saveDates(d)    { localStorage.setItem(LS_DATES,    JSON.stringify(d)); }

// ═══════════════════════════════════════════════════════════
//  SUPABASE FETCH
// ═══════════════════════════════════════════════════════════
async function sbGet(path) {
  const r = await fetch(SB_URL + path, {
    headers: { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON }
  });
  if (!r.ok) throw new Error('Supabase ' + r.status);
  return r.json();
}

async function loadAlbums() {
  const msg = document.getElementById('loading-msg');
  const all = [];
  const PAGE = 1000;
  let offset = 0;
  while (true) {
    msg.textContent = `Caricamento… ${all.length} album`;
    const batch = await sbGet(
      `/rest/v1/albums?select=id,catalog,year,artist,artist_list,title,notes,series,musicians,musician_list,cover_url,cover_ok,mbid,rg_mbid`
      + `&order=catalog&limit=${PAGE}&offset=${offset}`
    );
    if (!Array.isArray(batch) || batch.length === 0) break;
    all.push(...batch);
    if (batch.length < PAGE) break;
    offset += PAGE;
  }
  // map DB rows → app format
  return all.map(r => ({
    id:           r.id,
    catalog:      r.catalog || r.id,
    year:         r.year || '',
    artist:       r.artist || '',
    artistList:   r.artist_list || [],
    title:        r.title || '',
    notes:        r.notes || '',
    series:       r.series || '',
    musicians:    r.musicians || '',
    musicianList: r.musician_list || [],
    cover_url:    r.cover_url || null,
    cover_ok:     r.cover_ok || false,
    mbid:         r.mbid || null,
    rg_mbid:      r.rg_mbid || null,
  }));
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  try {
    ALBUMS = await loadAlbums();
  } catch(e) {
    document.getElementById('loading-msg').textContent = 'Errore caricamento: ' + e.message;
    return;
  }
  document.getElementById('loading-screen').classList.add('hidden');
  buildDecades();
  updateCounts();
  applyFilters();
}

// ═══════════════════════════════════════════════════════════
//  FILTERING & SORTING
// ═══════════════════════════════════════════════════════════
function applyFilters() {
  const owned    = getOwned();
  const wishlist = getWishlist();
  const q = currentSearch.toLowerCase();

  filtered = ALBUMS.filter(a => {
    if (currentView === 'owned'    && !owned[a.id])    return false;
    if (currentView === 'wishlist' && !wishlist[a.id]) return false;
    if (currentView === 'series'   && !seriesMatch(a, currentSeries)) return false;
    if (currentArtist && !artistMatch(a, currentArtist)) return false;
    if (activeDecade !== null) {
      const y = parseInt(a.year);
      if (isNaN(y) || Math.floor(y / 10) * 10 !== activeDecade) return false;
    }
    if (q) {
      const hay = (a.catalog + ' ' + a.artist + ' ' + a.title + ' ' + a.musicians).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  sortFiltered();
  renderGrid();
  updateInfo();
  updateNavActive();
}

function seriesMatch(a, key) {
  const cat = (a.catalog || '').toUpperCase();
  const n   = parseInt((cat.match(/\d+/) || [0])[0]);
  if (key === 'ecm1') return /^ECM/.test(cat) && n >= 1000 && n < 2000;
  if (key === 'ecm2') return /^ECM/.test(cat) && n >= 2000;
  if (key === 'ns')   return /NEW.?SERIES/i.test(a.series || '') || /^ECM\s*NS/i.test(cat);
  if (key === 'japo') return /^JAPO/i.test(cat);
  return false;
}

function people(a) {
  if (a._people) return a._people;
  const s = new Set();
  (Array.isArray(a.artistList) ? a.artistList : []).forEach(n => n && s.add(n.trim()));
  (Array.isArray(a.musicianList) ? a.musicianList : []).forEach(n => n && s.add(n.trim()));
  if (!s.size && a.artist) {
    a.artist.split(/\s*(?:\/|,|&|\band\b|\be\b|\bwith\b)\s*/i).forEach(n => n && s.add(n.trim()));
  }
  return (a._people = s);
}

function artistMatch(a, name) {
  return a.artist === name || people(a).has(name);
}

function sortFiltered() {
  filtered.sort((a, b) => {
    if (currentSort === 'year')   return (a.year || '0').localeCompare(b.year || '0');
    if (currentSort === 'artist') return a.artist.localeCompare(b.artist);
    if (currentSort === 'title')  return a.title.localeCompare(b.title);
    // cat: natural sort by number
    const na = parseInt((a.catalog.match(/\d+/) || [0])[0]);
    const nb = parseInt((b.catalog.match(/\d+/) || [0])[0]);
    return na - nb;
  });
}

// ═══════════════════════════════════════════════════════════
//  RENDER GRID
// ═══════════════════════════════════════════════════════════
function renderGrid() {
  const owned    = getOwned();
  const wishlist = getWishlist();
  const grid = document.getElementById('album-grid');
  const empty = document.getElementById('empty');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  grid.innerHTML = filtered.map(a => {
    const isOwned = owned[a.id];
    const isWish  = wishlist[a.id];
    const ind = isOwned ? '<span class="ind ind-owned"></span>'
               : isWish ? '<span class="ind ind-wish"></span>' : '';
    const cover = a.cover_url
      ? `<img src="${a.cover_url}" loading="lazy" alt="" onload="this.classList.add('loaded')">`
      : '';
    return `<div class="album-card" onclick="openDetail('${esc(a.id)}')">
      <div class="album-cover">
        <div class="album-cover-bg"><span class="album-cover-num">${esc(a.catalog)}</span></div>
        ${cover}
      </div>
      <div class="album-info">
        <div class="album-artist">${esc(a.artist)}</div>
        <div class="album-title">${esc(a.title)}</div>
        <div class="album-meta">
          ${ind}
          <span class="album-year">${esc(a.year)}</span>
          <span class="album-cat">${esc(a.catalog)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════
//  COUNTS & INFO
// ═══════════════════════════════════════════════════════════
function updateCounts() {
  const owned    = getOwned();
  const wishlist = getWishlist();

  const counts = {
    all: ALBUMS.length,
    owned: Object.keys(owned).filter(k => owned[k]).length,
    wishlist: Object.keys(wishlist).filter(k => wishlist[k]).length,
    ecm1: ALBUMS.filter(a => seriesMatch(a, 'ecm1')).length,
    ecm2: ALBUMS.filter(a => seriesMatch(a, 'ecm2')).length,
    ns:   ALBUMS.filter(a => seriesMatch(a, 'ns')).length,
    japo: ALBUMS.filter(a => seriesMatch(a, 'japo')).length,
  };
  const withCover = ALBUMS.filter(a => a.cover_ok).length;

  document.getElementById('cnt-all').textContent   = counts.all;
  document.getElementById('cnt-owned').textContent  = counts.owned;
  document.getElementById('cnt-wish').textContent   = counts.wishlist;
  document.getElementById('cnt-ecm1').textContent   = counts.ecm1;
  document.getElementById('cnt-ecm2').textContent   = counts.ecm2;
  document.getElementById('cnt-ns').textContent     = counts.ns;
  document.getElementById('cnt-japo').textContent   = counts.japo;

  document.getElementById('db-stats').innerHTML =
    `<strong>${counts.all}</strong> album nel catalogo<br>` +
    `<strong>${withCover}</strong> copertine disponibili<br>` +
    `<strong>${counts.owned}</strong> posseduti · <strong>${counts.wishlist}</strong> wishlist`;
}

function updateInfo() {
  const el = document.getElementById('results-info');
  el.textContent = filtered.length === ALBUMS.length
    ? `${ALBUMS.length} album`
    : `${filtered.length} / ${ALBUMS.length}`;
}

function updateNavActive() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const map = {
    'all':     'nav-all',
    'owned':   'nav-owned',
    'wishlist':'nav-wish',
  };
  if (map[currentView]) {
    document.getElementById(map[currentView])?.classList.add('active');
  }
  if (currentView === 'series') {
    const ids = {'ecm1':'nav-ecm1','ecm2':'nav-ecm2','ns':'nav-ns','japo':'nav-japo'};
    document.getElementById(ids[currentSeries] || '')?.classList.add('active');
  }
}

// ═══════════════════════════════════════════════════════════
//  NAVIGATION ACTIONS
// ═══════════════════════════════════════════════════════════
function setView(view, series) {
  currentView   = view;
  currentSeries = series || null;
  currentArtist = null;
  document.getElementById('artist-header').classList.remove('open');
  applyFilters();
}

function onSearch(val) {
  currentSearch = val;
  applyFilters();
}

function onSort(val) {
  currentSort = val;
  applyFilters();
}

// ── Decade filter ──
function buildDecades() {
  const decades = new Set();
  ALBUMS.forEach(a => {
    const y = parseInt(a.year);
    if (!isNaN(y)) decades.add(Math.floor(y / 10) * 10);
  });
  const pills = document.getElementById('decade-pills');
  pills.innerHTML = [...decades].sort().map(d =>
    `<button class="filter-btn" id="dec-${d}" onclick="setDecade(${d})">${d}s</button>`
  ).join('');
}

function toggleDecade() {
  decadeOpen = !decadeOpen;
  const pills = document.getElementById('decade-pills');
  pills.style.display = decadeOpen ? 'flex' : 'none';
  document.getElementById('fb-decade').classList.toggle('active', decadeOpen);
}

function setDecade(d) {
  if (activeDecade === d) {
    activeDecade = null;
    document.querySelectorAll('[id^=dec-]').forEach(b => b.classList.remove('active'));
  } else {
    activeDecade = d;
    document.querySelectorAll('[id^=dec-]').forEach(b => b.classList.remove('active'));
    document.getElementById('dec-' + d)?.classList.add('active');
  }
  applyFilters();
}

function clearArtist() {
  currentArtist = null;
  document.getElementById('artist-header').classList.remove('open');
  applyFilters();
}

function filterByArtist(name) {
  closeDetailDirect();
  currentArtist = name;
  document.getElementById('artist-header').classList.add('open');
  document.getElementById('artist-name-display').textContent = name;
  applyFilters();
}

// ═══════════════════════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════════════════════
function openDetail(id) {
  openAlbum = ALBUMS.find(a => a.id === id);
  if (!openAlbum) return;
  renderDetail();
  document.getElementById('detail-overlay').classList.add('open');
}

function renderDetail() {
  const a = openAlbum;
  const owned    = getOwned();
  const wishlist = getWishlist();
  const dates    = getDates();

  document.getElementById('detail-cover-num').textContent = a.catalog;
  document.getElementById('detail-cat').textContent       = a.catalog;
  document.getElementById('detail-title').textContent     = a.title;
  const names = (Array.isArray(a.artistList) && a.artistList.length) ? a.artistList : [a.artist];
  document.getElementById('detail-artist').innerHTML = names.map(n =>
    `<span class="musician-tag" style="font-size:13px" onclick="filterByArtist('${esc(n).replace(/'/g, "\\'")}')">${esc(n)}</span>`
  ).join(' ');
  document.getElementById('detail-year').textContent      = a.year || '';
  document.getElementById('detail-musicians').textContent = a.musicians || '';
  document.getElementById('detail-notes').textContent     = a.notes || '';

  const img = document.getElementById('detail-cover-img');
  if (a.cover_url) {
    img.src = a.cover_url;
    img.style.display = '';
  } else {
    img.src = '';
    img.style.display = 'none';
  }

  // owned button
  const btnO = document.getElementById('btn-owned');
  if (owned[a.id]) {
    btnO.textContent = '✓ Posseduto';
    btnO.className = 'btn btn-owned-active';
    const dp = document.getElementById('detail-purchase');
    dp.style.display = 'block';
    document.getElementById('purchase-date-input').value = dates[a.id] || '';
  } else {
    btnO.textContent = '+ Aggiungi';
    btnO.className = 'btn btn-primary';
    document.getElementById('detail-purchase').style.display = 'none';
  }

  // wishlist button
  const btnW = document.getElementById('btn-wish');
  if (wishlist[a.id]) {
    btnW.textContent = '♡ In wishlist';
    btnW.className = 'btn btn-wish-active';
  } else {
    btnW.textContent = '♡ Wishlist';
    btnW.className = 'btn btn-wish';
  }

  // musicians tags (from musicianList) or plain text (from musicians field)
  const ml = document.getElementById('musician-list');
  const ms = document.getElementById('musicians-section');
  const mTitle = ms.querySelector('.section-title');
  if (Array.isArray(a.musicianList) && a.musicianList.length) {
    mTitle.textContent = 'Musicisti';
    ml.innerHTML = a.musicianList.map(m =>
      `<span class="musician-tag" onclick="filterByArtist('${esc(m)}')">${esc(m)}</span>`
    ).join('');
    ms.style.display = 'block';
  } else if (a.musicians) {
    mTitle.textContent = 'Musicisti';
    ml.innerHTML = `<span style="font-size:11px;color:var(--text2);line-height:1.6">${esc(a.musicians)}</span>`;
    ms.style.display = 'block';
  } else {
    ms.style.display = 'none';
  }

  // MusicBrainz links
  const mbSection = document.getElementById('mb-links');
  if (a.mbid || a.rg_mbid) {
    let links = '';
    if (a.rg_mbid) links += `<a class="mb-link" href="https://musicbrainz.org/release-group/${a.rg_mbid}" target="_blank">MusicBrainz</a>`;
    if (a.mbid)    links += `<a class="mb-link" href="https://musicbrainz.org/release/${a.mbid}" target="_blank">MB Release</a>`;
    if (a.rg_mbid) links += `<a class="mb-link" href="https://coverartarchive.org/release-group/${a.rg_mbid}" target="_blank">Cover Art Archive</a>`;
    mbSection.innerHTML = links;
    mbSection.style.display = 'flex';
  } else {
    mbSection.style.display = 'none';
  }

  // related (shared musicians)
  renderRelated(a);
}

function renderRelated(a) {
  const section = document.getElementById('related-section');
  const mine = people(a);
  if (!mine.size) { section.style.display = 'none'; return; }
  const related = ALBUMS
    .filter(b => b.id !== a.id)
    .map(b => ({ b, n: [...people(b)].filter(p => mine.has(p)).length }))
    .filter(x => x.n > 0)
    .sort((x, y) => y.n - x.n || (x.b.year || '').localeCompare(y.b.year || ''))
    .slice(0, 24)
    .map(x => x.b);

  if (!related.length) { section.style.display = 'none'; return; }

  document.getElementById('related-count').textContent = `(${related.length})`;
  document.getElementById('related-list').innerHTML = related.map(b => {
    const cover = b.cover_url
      ? `<img src="${b.cover_url}" loading="lazy" alt="" onload="this.classList.add('loaded')">`
      : '';
    return `<div class="related-card" onclick="openDetail('${esc(b.id)}')">
      <div class="related-cover">${cover}</div>
      <div class="related-artist">${esc(b.artist)}</div>
      <div class="related-title">${esc(b.title)}</div>
    </div>`;
  }).join('');
  section.style.display = 'block';
}

function closeDetail(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetailDirect();
}
function closeDetailDirect() {
  document.getElementById('detail-overlay').classList.remove('open');
  openAlbum = null;
}

// ═══════════════════════════════════════════════════════════
//  OWNED / WISHLIST TOGGLE
// ═══════════════════════════════════════════════════════════
function toggleOwned() {
  if (!openAlbum) return;
  const owned = getOwned();
  owned[openAlbum.id] = !owned[openAlbum.id];
  if (!owned[openAlbum.id]) delete owned[openAlbum.id];
  saveOwned(owned);
  updateCounts();
  renderDetail();
  applyFilters();
}

function toggleWish() {
  if (!openAlbum) return;
  const wish = getWishlist();
  wish[openAlbum.id] = !wish[openAlbum.id];
  if (!wish[openAlbum.id]) delete wish[openAlbum.id];
  saveWishlist(wish);
  updateCounts();
  renderDetail();
  applyFilters();
}

function savePurchaseDate(val) {
  if (!openAlbum) return;
  const dates = getDates();
  if (val) dates[openAlbum.id] = val;
  else delete dates[openAlbum.id];
  saveDates(dates);
}

// keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetailDirect();
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// ═══════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════
init();
</script>
</body>
</html>
