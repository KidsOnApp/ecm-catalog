name: Update ECM Catalog

on:
  schedule:
    - cron: '0 9 * * 1'   # ogni lunedì 09:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DISCOGS_TOKEN:        ${{ secrets.DISCOGS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 1. Nuove uscite da MusicBrainz -> Supabase
        run: python update_catalog.py
      - name: 2. Copertine mancanti
        run: python download_covers.py
      - name: 3. MBID e musicisti mancanti
        run: python enrich_musicians.py
